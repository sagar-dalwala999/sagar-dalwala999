name: Refresh profile cards

# Regenerates assets/stats.svg, langs.svg and activity.svg from live GitHub data,
# in the profile's own style — no third-party stats service involved.

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC (08:47 IST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - run: pip install -r .github/scripts/requirements.txt

      - name: Generate cards
        env:
          # Optional: add a classic PAT named PROFILE_TOKEN (scope: read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_stats.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/activity.svg
          git diff --staged --quiet || (git commit -m "chore: refresh profile cards" && git push)
