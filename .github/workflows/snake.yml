name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: sagar-dalwala999
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f9c74f&color_dots=#161b22,#0b3b2e,#146c43,#1f9d55,#8ff0a4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
